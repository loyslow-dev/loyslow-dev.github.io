<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@loyslow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@1,400&family=Unbounded:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="entry-screen">
        <div class="glitch-wrapper">
            <h1 class="glitch" data-text="click to enter">click to enter</h1>
        </div>
    </div>

    <video id="bg-video" loop playsinline>
        <source src="bg.mp4" type="video/mp4">
    </video>

    <div id="main-content">
        <div class="volume-control">
            <i class='bx bx-volume-full' id="volume-icon"></i>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
        </div>

        <div class="glass-card">
            <div class="avatar-wrapper">
                <div class="avatar-glow"></div>
                <img id="avatar" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="loyslow">
            </div>
            <div class="username-wrapper">
                <img id="status-icon" src="icon.png" alt="icon">
                <h2 id="username">loyslow</h2>
            </div>
            <p id="desc">типичный интернет-герой</p>
            <div class="social-links">
                <a href="#" id="discord-link" title="loyslow">
                    <i class='bx bxl-discord-alt'></i>
                </a>
                <a href="https://vk.com/loyslow" target="_blank" rel="noopener noreferrer"><i class='bx bxl-vk'></i></a>
                <a href="https://t.me/loyslow" target="_blank" rel="noopener noreferrer"><i class='bx bxl-telegram'></i></a>
                <a href="https://github.com/loyslow-dev" target="_blank" rel="noopener noreferrer"><i class='bx bxl-github'></i></a>
            </div>
            
            <div id="moscow-time">
                <i class='bx bx-time'></i>
                <span id="time-display">00:00:00</span>
                <span class="timezone">MSK</span>
            </div>
        </div>
    </div>

    <div id="toast">Скопировано!</div>

    <script src="script.js"></script>
</body>
</html>
